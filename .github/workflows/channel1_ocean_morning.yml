name: Channel 1 - USA Morning Ocean Waves (6:30 AM EST / 4:00 PM IST)

on:
  schedule:
    # USA Morning Slot (6:30 AM EST / 10:30 UTC / 4:00 PM IST) -> Morning Ocean Waves
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  trigger-ocean-morning-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API Credentials
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"sonuji93","key":"30359df27329878ca4326b93196c3d59"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger Morning Ocean Waves on Kaggle
        run: |
          python push_to_kaggle.py --slot morning
